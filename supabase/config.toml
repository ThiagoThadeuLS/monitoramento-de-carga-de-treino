# Configuração usada pelo Supabase CLI ao publicar as funções.
# A função de lembretes é chamada pelo agendamento do próprio banco (pg_cron),
# sem usuário logado; ela não recebe dados de quem chama e não envia nada fora
# das regras do banco (push_due_reminders), então não exige token.
[functions.enviar-lembretes]
verify_jwt = false

# Foto do próprio atleta: o atleta não tem login do Supabase (entra com CPF + senha do
# app). A função confere a sessão dele no banco antes de gravar a foto.
[functions.foto-atleta]
verify_jwt = false

# WHOOP: o atleta conecta pelo token do app (não tem login Supabase) e a volta do
# OAuth chega sem token. A função confere quem é pelo banco e pelos segredos da WHOOP.
[functions.whoop]
verify_jwt = false
